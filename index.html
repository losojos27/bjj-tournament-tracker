<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADCC 2026 — Kraków</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ADCC">
<meta name="theme-color" content="#f1f0ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#343331" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://floarena.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
<script>try{var t=localStorage.getItem('bjjTracker.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="field-manual-theme/theme.css">
<style>
  /* App styles on top of field-manual-theme. Colour with meaning comes from the theme's
     category and cue tokens; everything else is tone and spacing (no borders, no shadows). */
  :root{ --follow:#1f6f7a; --win:var(--type-a); --lose:var(--text-muted); --live:var(--cue-warning); } /* follow: a teal lit per theme below; not the kit's type-c/d, which stay dark on charcoal */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --follow:#62bccb; } }
  :root[data-theme="dark"]{ --follow:#62bccb; }
  /* Phone-first scale: the kit's defaults read small in the arena. Bump the root and the type tokens together. */
  html{font-size:17px}
  :root{ --fs-body:1rem; --fs-meta:.86rem; --fs-eyebrow:.8rem; --fs-card-title:1.05rem; }
  /* Dark cards sit too close to the ground tone; lift them (and the muted text on them). Both dark blocks, kept in sync. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg-card:#454340; --bg-card-hover:#504e4a; --chip-bg:#454340; --text-muted:#979289; } }
  :root[data-theme="dark"]{ --bg-card:#454340; --bg-card-hover:#504e4a; --chip-bg:#454340; --text-muted:#979289; }
  .chip{font-size:.88rem}
  .chip.small{padding:4px 10px;font-size:.78rem}
  .panel .chip{background:var(--accent-soft);color:var(--text-primary)}   /* a control on a card: visibly inset from the card tone */
  .panel .chip.active{background:var(--accent);color:var(--accent-contrast)}
  .panel .chip.warn{background:var(--cue-warning);color:var(--accent-contrast)}
  .container{max-width:720px}
  /* sticky header: title row + tabs. Tabs live up here so Safari's own bottom bar has the bottom to itself. */
  .top{position:sticky;top:0;z-index:200;padding-top:env(safe-area-inset-top);background:color-mix(in srgb, var(--bg-primary) 94%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .topbar{display:flex;align-items:center;gap:10px;padding-block:10px 0}
  .tabs{display:flex;padding-block:0;padding-bottom:0}
  .tab{position:relative;flex:1;background:none;border:0;padding:9px 4px 11px;font:inherit;font-size:.92rem;font-weight:500;color:var(--text-muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tab.active{color:var(--accent);font-weight:650}
  .tab.active::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:28px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent-soft);outline-offset:-2px}
  main.container{padding-top:12px;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
  .topbar .title{font-family:var(--font-heading);font-weight:650;font-size:1.05rem;letter-spacing:-.02em;white-space:nowrap}
  .status{flex:1;min-width:0;font-size:var(--fs-eyebrow);color:var(--text-muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status .bad{color:var(--cue-warning)}
  .bad-note{color:var(--cue-warning)}
  .status b{color:var(--live);font-weight:650}
  @media (max-width:480px){ .status .sync{display:none} }
  .section-title{font-size:var(--fs-meta);font-weight:600;color:var(--text-muted);margin:18px 0 8px}
  main > .section-title:first-child{margin-top:2px}
  .panel{background:var(--bg-card);border-radius:var(--radius-md);padding:12px 14px}
  .panel.quiet{color:var(--text-secondary);font-size:var(--fs-meta)}
  .demo-bar{margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
  .demo-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .demo-ctl label{margin:0 0 0 4px}
  .demo-ctl select.field{width:auto;padding:5px 8px;font-size:var(--fs-meta);-webkit-appearance:menulist;appearance:menulist}
  .stack{display:flex;flex-direction:column;gap:6px}
  .chip.warn{background:var(--cue-warning);color:var(--accent-contrast)}
  .chip:focus-visible{outline:2px solid var(--accent-soft);outline-offset:1px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
  .note{font-size:var(--fs-meta);color:var(--text-muted);margin-top:8px}
  a.plain{color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--text-muted);text-underline-offset:3px}
  .swipe-hint{margin:0 0 10px}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  /* followed athletes */
  .follow-card{display:flex;align-items:center;gap:12px}
  .big{font-family:var(--font-heading);font-size:1.35rem;font-weight:650;letter-spacing:-.02em;line-height:1.15}
  .sub{font-size:var(--fs-meta);color:var(--text-muted);margin-top:2px}
  /* queue rows */
  .row{display:grid;grid-template-columns:96px 1fr;gap:10px}
  .row.now{background:color-mix(in srgb, var(--cue-warning) 12%, var(--bg-card))}
  .t{font-family:var(--font-heading);font-weight:650;font-size:1.1rem;line-height:1.15;font-variant-numeric:tabular-nums}
  .t small{display:block;color:var(--text-muted);font-weight:400;font-size:var(--fs-eyebrow)}
  .meta{color:var(--text-muted);font-size:var(--fs-eyebrow);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .vs{display:flex;flex-direction:column;gap:2px}
  .name{display:flex;align-items:center;gap:7px;color:var(--text-primary);font:inherit;font-size:var(--fs-body);padding:4px 0;background:none;border:0;text-align:left;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:var(--radius-sm)}
  .name:active{background:var(--bg-card-hover)}
  .name:focus-visible{outline:2px solid var(--accent-soft);outline-offset:1px}
  .name.tbd{color:var(--text-muted);font-style:italic;cursor:default}
  .name.win{color:var(--win);font-weight:600}
  .name.lose{color:var(--lose);text-decoration:line-through}
  .name.follow{font-weight:650}   /* the follow colour is the row/box tint, so a followed winner still reads green and a loser struck */
  .row.fol,.bx.fol,.panel.follow-card{background:color-mix(in srgb, var(--follow) 22%, var(--bg-card))}
  .row.fol .meta,.row.fol .t small,.panel.follow-card .sub,.bx.fol .meta .num{color:var(--text-primary)}   /* muted grey fails contrast on the tint */
  .row.fol.now{background:color-mix(in srgb, var(--cue-warning) 14%, color-mix(in srgb, var(--follow) 16%, var(--bg-card)))}
  .name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flag{display:inline-block;width:1.25em;text-align:center;flex-shrink:0;font-size:1.05em;line-height:1}
  .big .flag{margin-right:.35em;font-size:.9em}
  .copy-name{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:var(--radius-sm)}
  .copy-name:active{background:var(--bg-card-hover)}
  .mat .who-l{display:flex;align-items:center;gap:6px;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mat .who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seed{font-size:var(--fs-eyebrow);color:var(--text-muted);min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
  .res{margin-left:auto;color:var(--text-secondary)}
  .cue{font-size:.68rem;padding:1px 7px;margin:0}
  .cue.live{background:var(--live)}
  /* live mats */
  .mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
  .mat .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-eyebrow);color:var(--text-muted);margin-bottom:6px}
  .mat .hd b{color:var(--text-primary);font-weight:600}
  .mat .clock{font-weight:650;color:var(--live);font-variant-numeric:tabular-nums}
  .mat .who{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0;font-size:var(--fs-body)}
  .mat .who .sc{font-weight:650;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
  .mat .who.w{color:var(--win)} .mat .who.l{color:var(--lose)} .mat .who.follow{font-weight:650}
  .mat .ft{font-size:var(--fs-eyebrow);color:var(--text-muted);margin-top:4px}
  .mat.done{opacity:.72}
  .mat.done .ft b{color:var(--text-primary);font-weight:600}
  /* bracket: columns per round; connectors are the one place an edge is load-bearing */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips .chip{flex:0 0 auto}
  .bwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;margin:0 calc(-1*var(--spacing));padding-left:var(--spacing)}
  .bracket{display:flex;gap:26px;width:max-content;--pitch:92px;--gap:26px;padding-right:var(--spacing)}
  .col{width:250px;flex:0 0 auto}
  .col h3{font-size:var(--fs-eyebrow);font-weight:600;color:var(--text-muted);margin:0 0 8px;text-align:center}
  .slots{display:flex;flex-direction:column;height:calc(var(--n1)*var(--pitch))}
  .slot{flex:1;display:flex;align-items:center;position:relative}
  .slot.single{flex:none;height:var(--pitch)}
  .col+.col .slot::before{content:"";position:absolute;left:calc(-1*var(--gap));width:calc(var(--gap)/2);top:25%;height:50%;border:2px solid var(--hairline-strong);border-left:0;border-radius:0 3px 3px 0}
  .col+.col .slot::after{content:"";position:absolute;left:calc(var(--gap)/-2);width:calc(var(--gap)/2);top:50%;border-top:2px solid var(--hairline-strong)}
  .bx{background:var(--bg-card);border-radius:var(--radius-md);padding:4px 7px 5px;width:100%;position:relative;z-index:1}
  .bx .meta{font-size:.76rem;line-height:1.4;margin:0 0 1px 2px;min-height:15px;white-space:nowrap;display:flex;justify-content:space-between;gap:6px}
  .bx .meta .num{color:var(--text-muted)}
  .bx .meta .res{margin-left:auto;color:var(--text-primary);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .bx .meta span.res:not(:empty){color:var(--text-secondary);font-weight:500}   /* a projected time is quieter than a result */
  .bx .meta a.res{color:var(--text-primary);font-weight:600}
  .bx .meta a.res{text-decoration:underline;text-decoration-color:var(--text-muted);text-underline-offset:3px}
  .bx .name{font-size:.94rem;line-height:1.35;padding:2px 0;gap:5px}
  .bx .seed{min-width:16px;font-size:.7rem}
  /* settings */
  label{display:block;margin:12px 0 5px;color:var(--text-muted);font-size:var(--fs-meta)}
  .fields{display:grid;grid-template-columns:1fr 120px;gap:10px 12px;align-items:center}
  .fields label{margin:0}
  .fields .field{text-align:right}
  .field{width:100%;background:var(--bg-primary);border:0;color:var(--text-primary);border-radius:var(--radius-pill);padding:10px 12px;font:inherit;font-size:var(--fs-body);outline:none}
  .field:focus{box-shadow:0 0 0 2px var(--accent-soft)}
  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-contrast);padding:8px 14px;border-radius:var(--radius-pill);font-size:var(--fs-meta);opacity:0;transition:opacity .2s;pointer-events:none;z-index:300}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast,.chip,.icon-btn{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="container topbar">
    <div class="title">ADCC 2026 <span class="muted">Kraków</span></div>
    <div class="status" id="status"></div>
  </div>
  <nav class="container tabs" aria-label="sections">
    <button class="tab active" data-tab="next" type="button">next up</button>
    <button class="tab" data-tab="brackets" type="button">brackets</button>
    <button class="tab" data-tab="settings" type="button">settings</button>
  </nav>
</header>
<main id="main" class="container"><div class="panel">loading bracket…</div></main>
<div class="toast" id="toast"></div>
<script src="field-manual-theme/theme.js" data-key="bjjTracker.theme"></script>

<script id="app">
// ---------- sources ----------
// Bracket + results: data/results.json, written by scripts/sync.mjs from FloArena's bout endpoints
// (a GitHub Actions cron reruns it every few minutes). Live mats: FloArena's public Firebase feed,
// polled straight from the browser. Both are read-only; nothing is entered by hand.
const EVENT='52703b65-bade-46e2-9ce2-399dd32d93e4';
// Simulation (scripts/sim/server.mjs): only with ?sim AND only when the page is served from this machine or a
// private-network address. On the public site the parameter does nothing. Both sim feeds are same-origin paths,
// never a URL taken from the query string.
const SIM = new URLSearchParams(location.search).has('sim') &&
  /^(localhost|127\.0\.0\.1|\[::1\]|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|[a-z0-9-]+\.local)$/i.test(location.hostname);
// Demo: the same simulator running inside this browser, so a plain link can show the app in motion. Everything
// it loads is same-origin (the sim core and a frozen copy of ADCC 2026), so it is safe on the public site.
const DEMO = !SIM && new URLSearchParams(location.search).has('demo');
const SIMULATED = SIM || DEMO;
const DATA_URL = SIM ? 'sim/results.json' : 'data/results.json';
const LIVE_URL = SIM ? 'sim/mats.json' : `https://floarena.firebaseio.com/${EVENT}/mats.json`;
// a simulation runs many event-seconds per wall second; every projected duration is divided by this
const simSpeed = () => (SIMULATED && DATA && DATA.sim && DATA.sim.speed > 0) ? DATA.sim.speed : 1;
// what the page says its data is: one place, so demo mode never claims to be live anywhere
const SOURCE = DEMO ? { name:'replayed from ADCC 2026', cue:'replay', note:'this is a replay of ADCC 2026 from its real results, mats and finish times; nothing here is live.' }
                    : { name:'FloArena live', cue:'live', note:null };
const ROUND_LABEL={R32:'round of 32',R16:'round of 16',QF:'quarterfinal',SF:'semifinal',F:'final','3':'3rd place'};
const ROUND_HEAD={R32:'round of 32',R16:'round of 16',QF:'quarterfinals',SF:'semifinals',F:'final','3':'3rd place'};
const rl=r=>ROUND_LABEL[r]||r;

let DATA=null;            // parsed results.json
let LIVE={};              // boutNumber -> live mat entry
let liveState='off';      // 'ok' | 'bad' | 'off'
let dataErr=null, lastLive=0;
const quiet=()=>DATA&&(tab==='settings'||(document.activeElement&&document.activeElement.id==='demoSpeed')); // don't re-render under the user's fingers: Settings, or an open speed drop-down

// Schedule blocks: the assumed order each day runs in, used only until FloArena publishes its own. `kind` matches results.json divisions.
const DEFAULT_BLOCKS = [
  {id:'m-R16', label:"men round of 16",   kind:'pro', sex:'m', round:'R16', day:1},
  {id:'w-QF',  label:"women quarterfinals",  kind:'pro', sex:'w', round:'QF',  day:1},
  {id:'m-QF',  label:"men quarterfinals",    kind:'pro', sex:'m', round:'QF',  day:1},
  {id:'m-SF',  label:"men semifinals",    kind:'pro', sex:'m', round:'SF',  day:2},
  {id:'w-SF',  label:"women semifinals",  kind:'pro', sex:'w', round:'SF',  day:2},
  {id:'abs-R16',label:"absolute round of 16",kind:'abs', round:'R16', day:2},
  {id:'abs-QF',label:"absolute quarterfinals",kind:'abs', round:'QF',  day:2},
  {id:'w-3',   label:"women 3rd", kind:'pro', sex:'w', round:'3',   day:2},
  {id:'m-3',   label:"men 3rd",   kind:'pro', sex:'m', round:'3',   day:2},
  {id:'abs-SF',label:"absolute semifinals",kind:'abs', round:'SF',  day:2},
  {id:'w-F',   label:"women final",   kind:'pro', sex:'w', round:'F',   day:2},
  {id:'m-F',   label:"men final",     kind:'pro', sex:'m', round:'F',   day:2},
  {id:'abs-3', label:"absolute 3rd",kind:'abs', round:'3',  day:2},
  {id:'abs-F', label:"absolute final",kind:'abs', round:'F',   day:2},
  {id:'sf-F',  label:"super fights",kind:'sf', round:'F',  day:2},
];

const DEFAULT = {
  follow:['Felipe Costa','Victor Hugo'],
  // projection defaults (no UI: the live feed and Flo's published order override them as the day runs)
  mats:3, start1:'11:00', start2:'11:00',
  breakUntil:'',                   // 'HH:MM' local: an intermission the feeds can't know about; ignored once past or once a bout is live
  dur:{R32:12, R16:12, QF:20, SF:20, '3':20, F:30},
  bracketDiv:null,                 // division shown on the Brackets tab
  v:9,
};
let S = JSON.parse(JSON.stringify(DEFAULT));
let tab='next';

// ---------- persistence (local to this browser) ----------
const store = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
function loadState(){
  try{ const v=store.get('adcc26'); if(v){ const o=JSON.parse(v); S=Object.assign({},DEFAULT,o); S.dur=Object.assign({},DEFAULT.dur,o.dur||{}); } }catch(e){}
  if((S.v||0)<9){ // results used to be baked into the page; they now come from FloArena
    delete S.winners; delete S.third;
    S.v=9; save();
  }
  delete S.anchor; delete S.taps; delete S.blocks; delete S.day;
}
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>store.set('adcc26', JSON.stringify(S)),150); }

// ---------- data fetching ----------
// Results the live feed has shown as final, kept until results.json confirms them. The feed holds only each mat's
// CURRENT bout, so without this a finished bout went back to "undecided" the moment its mat moved on, and stayed
// that way until the next sync: it reappeared in the queue and the next round lost its name. Found with the
// simulator (Sept 21): at a 10-minute effective sync, 65 of ADCC's 121 results vanished for up to 6 minutes.
const SEEN=new Map();                                  // bout number -> the finished live entry
const SEEN_KEY='bjjTracker.seen.'+EVENT, SEEN_MAX_AGE=12*3600e3;
let lastSimT=-1;
function persistSeen(){ if(SIMULATED) return; try{ localStorage.setItem(SEEN_KEY, JSON.stringify([...SEEN.values()])); }catch(e){} }
function restoreSeen(){ if(SIMULATED) return; try{ for(const l of JSON.parse(localStorage.getItem(SEEN_KEY)||'[]')) if(l&&l.n&&l.over&&(l.winner===0||l.winner===1)&&Date.now()-(l.updated||0)<SEEN_MAX_AGE) SEEN.set(String(l.n),l); }catch(e){} }
function rememberFinished(){ let ch=false; for(const l of Object.values(LIVE)) if(l.over&&l.winner!==null&&!SEEN.has(l.n)){ SEEN.set(l.n,l); ch=true; } if(ch) persistSeen(); }
function forgetConfirmed(){   // results.json has caught up (Flo's word wins, including a corrected result), or a simulation jumped back in time
  if(!DATA) return; let ch=false;
  if(SIMULATED&&DATA.sim){ if(DATA.sim.t<lastSimT){ ch=SEEN.size>0; SEEN.clear(); } lastSimT=DATA.sim.t; }
  for(const d of DATA.divs) for(const b of [...d.rounds.flatMap(r=>r.bouts), ...(d.third?[d.third]:[])]) if(b.n&&(b.w!==null&&b.w!==undefined||b.decided)&&SEEN.delete(String(b.n))) ch=true;
  if(ch) persistSeen();
}
// ---------- demo: scripts/sim/core.mjs running in this browser ----------
const demo={clock:null}; const DEMO_KEY='bjjTracker.demo';
const DEMO_SPEEDS={default:10, list:[1,2,5,10,20,60,200]};   // ×1 is real time; at ×10 a seven-minute bout takes about 40 s
let demoLoading=null;
function demoReady(){ return demoLoading || (demoLoading=demoInit().catch(e=>{ demoLoading=null; throw e; })); }   // the two loaders start together; initialise once
async function demoInit(){
  const core=await import('./scripts/sim/core.mjs');
  const r=await fetch('scripts/sim/adcc-2026-final.json'); if(!r.ok) throw new Error('HTTP '+r.status);
  const final=await r.json(), tl=core.buildTimeline(final), q=new URLSearchParams(location.search);
  let saved=null; try{ const o=JSON.parse(sessionStorage.getItem(DEMO_KEY)||'null'); if(o&&o.q===location.search) saved=o.state; }catch(e){}   // a reload continues; a different link starts fresh
  const from=q.get('from')||'SF', speed=Math.min(1000,Math.max(1,+q.get('speed')||DEMO_SPEEDS.default));
  Object.assign(demo,{core,final,tl,from,clock:core.createClock(tl,{speed,from,saved})});
  return demo;
}
function demoSave(){ try{ sessionStorage.setItem(DEMO_KEY, JSON.stringify({q:location.search,state:demo.clock.state()})); }catch(e){} }
async function demoResults(){ const d=await demoReady(), c=d.clock; demoSave();
  return d.core.resultsAt(d.final,d.tl,c.snapshotT(),{speed:c.speed,paused:c.paused,sync:c.sync,t:Math.round(c.t()),demo:true},c.snapshotWall()); }
async function demoMats(){ const d=await demoReady(); return d.core.matsFeedAt(d.final,d.tl,d.clock.t(),Date.now(),d.clock.speed); }
function demoControl(cmd){ const c=demo.clock; if(!c) return; const [k,v]=String(cmd).split(':');
  if(k==='pause') c.pause(!c.paused); else if(k==='speed') c.setSpeed(+v); else if(k==='jump'){ c.jump(v); tab='next'; window.scrollTo(0,0); }
  demoSave(); loadData().then(loadLive).then(render); }

async function loadData(){

      for(const div of divs()){ const rn=rounds(div); const w=winnerOf(div,rn[rn.length-1],0); if(w!==null&&w>=0&&hit(slot(div,rn[rn.length-1],0,w))){ champ=true; status=`${esc(div.name)} champion 🥇`; } }
      const alive=divs().some(div=>div.rounds.some(r=>r.bouts.some((b,m)=>winnerOf(div,r.name,m)===null&&(hit(b.a)||hit(b.b)))));
      if(out&&!alive&&!champ) status='no scheduled matches';
      if(dayDone&&!champ) continue;   // a finished day: don't say "no match in today's queue"
      // the card names the fighter as the bracket does (flag, canonical spelling, copyable); a country entry gets its flag
      let who=null; for(const div of divs()){ for(const r of div.rounds) for(const b of r.bouts) for(const p of [b.a,b.b]) if(!who&&p&&p.name&&p.name.toLowerCase().includes(q_)) who=p; }
      const title=who?`<button type="button" class="copy-name" data-copy="${esc(who.name)}" title="copy name">${flagHtml(who.team)}${esc(who.name)}</button>`:`${flag(f)?flagHtml(f):''}${esc(f)}`;
      cards.push({at:new Date(8.64e15),html:`<div class="panel follow-card"><div><div class="big">${title}</div><div class="sub">${status}</div></div></div>`});
    }
  }
  cards.sort((x,y)=>x.at-y.at);
  if(cards.length) h+=`<h2 class="section-title">following</h2><div class="stack">${cards.map(c=>c.html).join('')}</div>`;
  h+=`<h2 class="section-title">up next</h2>`;
  if(dayDone) h+=`<div class="panel">that’s the event. results are in brackets.</div>`;
  else if(!q.length) h+=`<div class="panel">nothing in the queue yet.</div>`;
  else h+=`<div class="stack">`;
  if(!dayDone && q.length && liveState==='ok' && !onMats.length) h+=`<div class="panel quiet">${mode==='break'?`break until ${fmt(breakEnd())}. the times below are projected from then.`:'nothing on the mats right now. the times below are projected.'}</div>`;
  // bouts where neither name is known yet collapse into one line at the point where they start
  const unknown=q.filter(mo=>mo.a.tbd&&mo.b.tbd); const firstUnknown=unknown[0];
  q.slice(0,48).forEach(mo=>{
    if(mo.onMat) return;   // it's in the "on the mats" cards above; no second row
    if(mo.a.tbd&&mo.b.tbd){
      if(mo===firstUnknown){ const rs=[...new Set(unknown.map(x=>rl(x.rName)))].join(', ');
        h+=`<div class="panel quiet">${unknown.length} more from ${fmt(mo.at)}: ${esc(rs)}. names once the earlier rounds are done.</div>`; }
      return; }
    const fol=isFollow(mo.a)||isFollow(mo.b);
    h+=`<div class="panel row ${mo.onMat?'now':''} ${fol?'fol':''}"><div class="t">${mo.onMat?'now':fmt(mo.at)}<small>mat ${mo.mat}</small></div>
      <div><div class="meta">${esc(mo.div.name)} ${ROUND_LABEL[mo.rName]||mo.rName} ${mo.onMat?`<span class="cue live">on the mat · ${esc(mo.live.clock)}</span>`:''}</div>
      <div class="vs">${pName(mo.a,mo,0,{seed:false})}${pName(mo.b,mo,1,{seed:false})}</div></div></div>`;
  });
  if(q.length) h+=`</div>`;
  h+=`<div class="note">${DEMO?'everything here is '+SOURCE.name+'. ':floOrder?'results and the running order come from FloArena. ':'results come from FloArena. today’s mats and times are our guess until FloArena posts the order. '}tap a name to copy it.</div>`;
  return h;
}
function currentDiv(){
  const ds=divs(); if(!ds.length) return null;
  return ds.find(x=>x.id===S.bracketDiv) || ds.find(d=>d.rounds.some(r=>r.bouts.some(b=>isFollow(b.a)||isFollow(b.b)))) || ds[0];
}
// a slot is "backfilled" when its fighter is not the winner of the bout that feeds it (e.g. reinstated after a double DQ)
function backfilled(mo,s_){   // returns '' or a label like 'replacement after #39'
  if(mo.rName==='3') return ''; const rn=rounds(mo.div); const ri=rn.indexOf(mo.rName); if(ri<=0) return '';
  const p=s_?mo.b:mo.a; if(!p||p.tbd) return '';
  const prev=boutAt(mo.div,rn[ri-1],mo.m*2+s_); if(!prev||!prev.decided) return '';
  const win=prev.w===0?prev.a:prev.w===1?prev.b:null;
  if(win&&win.name===p.name) return '';
  if(!win) return `${p.name} in after the ${prev.n?'#'+prev.n+' ':''}${String(prev.winType||'').toUpperCase()==='DQ'?'disqualification':'no-winner bout'}`;
  return `${p.name} in for ${win.name}`;
}
// the feed's video URL is untrusted input: only https links on flograppling.com become hrefs
function safeVideo(u){ return typeof u==='string' && /^https:\/\/([a-z0-9-]+\.)*flograppling\.com\//i.test(u) ? u : null; }
let PROJ=new Map();   // key -> queued match, for the bracket's unfought boxes
let bracketFresh=false; // set when the division changes: open on the first unfought round, chip in view
function box(mo){
  const b=mo.bout||{};
  let res='';
  const pj=PROJ.get(mo.key); if(pj&&mo.w===null&&!(mo.live&&!mo.live.over)) res=pj.onMat?`on mat ${pj.mat}`:`${fmt(pj.at)} · mat ${pj.mat}`;
  if(mo.src==='flo'&&(b.winType||b.result)) res=fmtResult(b.winType,b.result)+(mo.w<0?' · no winner':'');
  else if(mo.src==='live'&&mo.live) res=(liveResult(mo.live)||'result in')+' · live';
  const live=mo.live&&!mo.live.over;
  const vid = safeVideo(b.video);
  const resHtml = res && vid ? `<a class="res vid" href="${esc(vid)}" target="_blank" rel="noopener" title="watch on FloGrappling">${esc(res)} ↗</a>` : `<span class="res">${esc(res)}</span>`;
  const bf=backfilled(mo,0)||backfilled(mo,1);
  const meta=`<span class="num">${b.n?'#'+esc(b.n):''}${bf?' · '+esc(bf):''}</span>${live?`<span class="cue live">on the mat · ${esc(mo.live.clock)}</span>`:''}${resHtml}`;
  const fol=isFollow(mo.a)||isFollow(mo.b);
  return `<div class="bx ${fol?'fol':''}"><div class="meta">${meta}</div>${pName(mo.a,mo,0)}${pName(mo.b,mo,1)}</div>`;
}
function renderBrackets(){
  const ds=divs(); const div=currentDiv(); if(!div) return `<div class="panel">no bracket data yet.</div>`;
  PROJ=new Map(queue().list.map(mo=>[mo.key,mo]));
  let h=`<div class="chips">${ds.map(d=>{ const rn=rounds(d); const c=winnerOf(d,rn[rn.length-1],0); return `<button type="button" data-bdiv="${esc(d.id)}" class="chip ${d.id===div.id?'active':''}">${esc(d.name)}${c!==null&&c>=0?' 🥇':''}</button>`; }).join('')}</div>`;
  const n1=div.rounds[0].bouts.length;
  let firstOpen=div.rounds.findIndex(r=>r.bouts.some((b,m)=>winnerOf(div,r.name,m)===null)); if(firstOpen<0) firstOpen=div.rounds.length;   // all decided: the final is the last completed round
  const openCol=Math.max(0,firstOpen-1);   // the column a fresh open scrolls to (see render()); the hint must agree with it
  const anyOpen=div.rounds.some(r=>r.bouts.some((b,m)=>winnerOf(div,r.name,m)===null));
  h+=`<h2 class="section-title">${esc(div.name)}${anyOpen?'<span style="font-weight:400"> · times are estimates</span>':''}</h2>`;
  h+=`<div class="note swipe-hint" hidden>${openCol>0?'swipe right for earlier rounds and results, left for later rounds.':'swipe left for later rounds.'}</div>`;
  h+=`<div class="bwrap" data-open-col="${openCol}"><div class="bracket" style="--n1:${n1}">`;
  for(const r of div.rounds){
    h+=`<div class="col"><h3>${ROUND_HEAD[r.name]||r.name}</h3><div class="slots">`;
    for(let m=0;m<r.bouts.length;m++) h+=`<div class="slot">${box(matchObj(div,r.name,m))}</div>`;
    h+=`</div></div>`;
  }
  h+=`</div></div>`;
  if(div.third) h+=`<div class="bracket" style="--n1:1;margin-top:4px"><div class="col"><h3>3rd place</h3><div class="slot single">${box(matchObj(div,'3',0))}</div></div></div>`;
  h+=`<div class="note">the green name won. tap a name to copy it; tap a result to watch the bout on FloGrappling.</div>`;
  return h;
}
function themeMode(){ try{ const t=localStorage.getItem('bjjTracker.theme'); return t==='light'||t==='dark'?t:'auto'; }catch(e){ return 'auto'; } }
function setThemeMode(v){ // theme.js owns the switch; cycle it until the stored mode matches
  for(let i=0;i<3&&themeMode()!==v;i++) window.AppTheme&&window.AppTheme.cycle();
}
function unmatchedFollows(){
  if(!DATA) return [];
  const people=[]; for(const d of divs()){ for(const r of d.rounds) for(const b of r.bouts) people.push(b.a,b.b); if(d.third) people.push(d.third.a,d.third.b); }
  return S.follow.filter(f=>f&&!people.some(p=>p&&p.name&&(p.name.toLowerCase().includes(f.toLowerCase())||String(p.team||'').toLowerCase().includes(f.toLowerCase()))));
}
function renderSettings(){
  const synced=DATA?fmt(new Date(DATA.updated)):'not loaded';
  const dc=demo.clock;
  const demoPanel = DEMO&&dc ? `
  <h2 class="section-title">demo</h2>
  <div class="panel">
    <div class="note" style="margin:0 0 10px">${SOURCE.note} it runs in this browser.</div>
    <label style="margin-top:0">speed (×1 is real time)</label>
    <div class="chip-row"><button type="button" class="chip" data-demo="pause">${dc.paused?'resume':'pause'}</button>${DEMO_SPEEDS.list.map(x=>`<button type="button" class="chip ${dc.speed===x?'active':''}" data-demo="speed:${x}">×${x}</button>`).join('')}</div>
    <label>jump to</label>
    <div class="chip-row">${[['R16','round of 16 (day 1)'],['QF','quarterfinals'],['SF','semifinals'],['third','3rd place'],['finals','finals'],['absolute','absolute']].filter(([k])=>dc.targets[k]!==undefined).map(([k,l])=>`<button type="button" class="chip" data-demo="jump:${k}">${l}</button>`).join('')}</div>
    <div class="note"><a class="plain" href="./">leave the demo and see the real page</a></div>
  </div>` : '';
  return `${demoPanel}
  <h2 class="section-title">following</h2>
  <div class="panel">
    <input class="field" id="follow" value="${esc(S.follow.join(', '))}" placeholder="names or countries, comma separated" aria-label="following" autocomplete="off" autocapitalize="words">
    ${unmatchedFollows().map(f=>`<div class="note bad-note">no fighter or country matches “${esc(f)}”</div>`).join('')}
    <div class="note">partial names work. a country (USA, Poland) follows everyone from it. followed fighters are highlighted everywhere and get a card at the top of next up while they’re still in it.</div>
  </div>
  <h2 class="section-title">appearance</h2>
  <div class="panel">
    <div class="chip-row">${['auto','light','dark'].map(v=>`<button type="button" class="chip ${themeMode()===v?'active':''}" data-theme-set="${v}">${v}</button>`).join('')}</div>
  </div>
  <h2 class="section-title">projection</h2>
  <div class="panel">
    <div class="fields">
      <label for="breakUntil">break until</label><input class="field" id="breakUntil" type="time" value="${esc(S.breakUntil||'')}">
      <label for="mats">mats running</label><input class="field" id="mats" type="number" inputmode="numeric" min="1" max="6" value="${+S.mats||3}">
      ${['R16','QF','SF','3','F'].map(k=>`<label for="dur-${k}">${ROUND_LABEL[k]||k} minutes</label><input class="field" id="dur-${k}" data-dur="${k}" type="number" inputmode="numeric" min="1" value="${+S.dur[k]||12}">`).join('')}
    </div>
    <div class="note">“break until” is for an intermission the feeds don’t announce: times project from then, and it’s ignored once it passes or a bout goes live. the rest is used only until FloArena publishes the running order; minutes are per match slot, including the changeover.</div>
  </div>
  <h2 class="section-title">data</h2>
  <div class="panel">
    <div class="note" style="margin:0">${DEMO?SOURCE.note:`bracket, results, and mat order come from FloArena (last synced ${synced}). live scores and the clock come from FloArena’s mat feed.`} times are projected from that, never typed in. the follow list and these settings live in this browser only.</div>
    <div class="actions"><button type="button" class="chip warn" id="reset">reset everything</button></div>
  </div>`;
}
function renderStatus(){
  const s=$('#status'); if(!s) return;
  const dataTxt = DATA ? `synced ${fmt(new Date(DATA.updated))}` : (dataErr?'<span class="bad">results failed</span>':'loading…');
  // results that fetch fine but are old are the failure mode that bit us: say so during a competition day
  const ageMin = DATA ? (Date.now()-new Date(DATA.updated).getTime())/60000 : 0;
  const eventDay = SIMULATED || Object.values(DAY_DATES).includes(localDate());
  const old = DATA&&eventDay&&ageMin>15 ? ` · <span class="bad">results ${ageMin<90?Math.round(ageMin)+' min':Math.round(ageMin/60)+' h'} old</span>` : '';
  const stale = (DATA&&dataErr ? ' · <span class="bad">stale</span>' : '') + old;
  const n=liveInProgress().length, lingering=n?0:matCards().length;   // the section below shows finished cards for a while; say so rather than "nothing"
  const liveTxt = liveState==='ok' ? (n?`<b>${n===1?'1 bout':n+' bouts'} on the mats</b>`:lingering?'between bouts':'nothing on the mats') : liveState==='bad' ? `<span class="bad">live feed lost</span>` : `live feed off`;
  const simTxt = SIMULATED ? `<span class="bad">${DEMO?'demo':'simulation'}${simSpeed()!==1?' ×'+simSpeed():''}${DATA&&DATA.sim&&DATA.sim.paused?' paused':''}</span> · ` : '';   // never mistakable for the real thing
  s.innerHTML=`${simTxt}${liveTxt}${stale}<span class="sync"> · ${dataTxt}</span>`;
}
function render(){
  document.querySelectorAll('.tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderStatus();
  if(!DATA){ $('#main').innerHTML = dataErr ? `<div class="panel">couldn’t load the bracket (${esc(dataErr.message)}). retrying every minute.</div>` : `<div class="panel">loading bracket…</div>`; return; }
  // redraws (live poll) must not lose where the bracket or the chip row was scrolled to
  const bw=$('#main').querySelector('.bwrap'); const keepX=bw&&!bracketFresh?bw.scrollLeft:-1;
  const ch=$('#main').querySelector('.chips'); const keepC=ch&&!bracketFresh?ch.scrollLeft:-1;
  bracketFresh=false;
  $('#main').innerHTML = tab==='next'?renderNext():tab==='brackets'?renderBrackets():renderSettings();
  if(tab==='brackets'){
    const bw2=$('#main').querySelector('.bwrap'), ch2=$('#main').querySelector('.chips');
    if(keepC>=0) ch2.scrollLeft=keepC; else ch2.querySelector('.chip.active')?.scrollIntoView({inline:'center',block:'nearest'});
    if(keepX>=0) bw2.scrollLeft=keepX;
    else { const i=+bw2.dataset.openCol||0; const col=bw2.querySelectorAll('.col')[i]; if(col&&i>0) bw2.scrollLeft=Math.max(0,col.offsetLeft-parseInt(getComputedStyle(bw2).paddingLeft||0)); }  // fresh open: the last completed round fully in view at the left, the next round peeking in
    const hint=$('#main').querySelector('.swipe-hint'); if(hint) hint.hidden = bw2.scrollWidth<=bw2.clientWidth+2;
  }
}
async function copyText(t){
  try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(t); toast(`copied ${t}`); return; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); toast(ok?`copied ${t}`:'couldn’t copy'); }catch(e){ toast('couldn’t copy'); }
}
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),3000); }

// ---------- events ----------
document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b){ tab=b.dataset.tab; render(); window.scrollTo(0,0);} });
$('#main').addEventListener('click',e=>{
  const dm=e.target.closest('[data-demo]'); if(dm){ demoControl(dm.dataset.demo); return; }
  const bd=e.target.closest('[data-bdiv]'); if(bd){ S.bracketDiv=bd.dataset.bdiv; bracketFresh=true; save(); render(); return; }
  const cp=e.target.closest('[data-copy]'); if(cp){ copyText(cp.dataset.copy); return; }
  const th=e.target.closest('[data-theme-set]'); if(th){ setThemeMode(th.dataset.themeSet); render(); return; }
  if(e.target.id==='reset'){ // two-tap confirm: native confirm() is blocked in sandboxed iframes
    if(e.target.dataset.armed){ S=JSON.parse(JSON.stringify(DEFAULT)); save(); render(); toast('reset'); }
    else{ e.target.dataset.armed='1'; e.target.textContent='tap again to reset the follow list and settings'; setTimeout(()=>{ if(e.target.isConnected){ delete e.target.dataset.armed; e.target.textContent='reset everything'; } },4000); }
    return; }
});
$('#main').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='follow'){ S.follow=t.value.split(',').map(x=>x.trim()).filter(Boolean); save(); }
  if(t.id==='mats'){ S.mats=Math.max(1,+t.value||1); save(); }
  if(t.id==='breakUntil'){ S.breakUntil=t.value||''; save(); }
  if(t.id==='demoSpeed'){ t.blur(); demoControl('speed:'+t.value); }
  if(t.dataset.dur){ S.dur[t.dataset.dur]=+t.value||12; save(); }
});
// entry point. A test harness sets window.QUEUE_TEST to a callback and gets the engine instead of a boot.
if(typeof window.QUEUE_TEST==='function') window.QUEUE_TEST({queue, S, SIM, DEMO, fmtResult, liveResult, setData:d=>{DATA=d; forgetConfirmed();}, setLive:l=>{LIVE=l; rememberFinished();}, forget:()=>SEEN.clear(), seen:()=>SEEN.size});
else {
  loadState(); restoreSeen(); loadData(); loadLive();
  // refresh loops: results every 60 s, live mats every 15 s (3 s and 1.5 s in a simulation, which runs many times
  // faster than a real day); the settings tab is left alone while you type
  const every=(fn,ms)=>{ const tick=()=>{ if(!quiet()) fn(); setTimeout(tick,ms); }; setTimeout(tick,ms); };
  every(loadData, SIMULATED?3000:60000); every(loadLive, SIMULATED?1500:15000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ loadData(); loadLive(); } });
}
</script>
</body>
</html>
