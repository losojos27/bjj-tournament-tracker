<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADCC">
<meta name="theme-color" content="#1b2230">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADCC 2026 — Kraków</title>
<style>
  :root{
    --bg:#1b2230; --panel:#242d3d; --line:#33405a; --ink:#e8ecf2; --dim:#94a0b8;
    --follow:#f2b84b; --win:#5ec27a; --now:#e0563f; --tbd:#6f7d99; --live:#3fa7e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
  .tabs{display:flex}
  .tabs button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:15px;padding:14px 4px 12px;border-bottom:3px solid transparent}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--follow);font-weight:600}
  .status{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--dim);padding:4px 12px 5px;letter-spacing:.02em}
  .status b{font-weight:600;color:var(--ink)}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tbd);margin-right:4px;vertical-align:1px}
  .status .dot.ok{background:var(--win)} .status .dot.bad{background:var(--now)}
  main{padding:12px 12px 80px;max-width:720px;margin:0 auto}
  h2{font-size:13px;font-weight:600;color:var(--dim);margin:18px 0 8px;letter-spacing:.02em}
  .card{background:var(--panel);border-radius:10px;padding:12px;margin-bottom:10px}
  .follow-card{border-left:4px solid var(--follow)}
  .big{font-size:26px;font-weight:700;line-height:1.1}
  .sub{color:var(--dim);font-size:14px;margin-top:2px}
  .row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.now{background:linear-gradient(90deg,rgba(224,86,63,.18),transparent);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px}
  .t{font-weight:700;font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
  .t small{display:block;color:var(--dim);font-weight:500;font-size:12px}
  .meta{color:var(--dim);font-size:12px;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .vs{display:flex;flex-direction:column;gap:4px}
  .name{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;text-align:left;padding:5px 6px;border-radius:6px;width:100%}
  .name:active{background:var(--line)}
  .name:focus-visible{outline:2px solid var(--follow);outline-offset:-2px}
  .name.tbd{color:var(--tbd);font-style:italic}
  .name.follow{color:var(--follow);font-weight:600}
  .name.win{color:var(--win);font-weight:700}
  .name.lose{color:var(--dim);text-decoration:line-through}
  .seed{font-size:11px;color:var(--dim);min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--dim);white-space:nowrap}
  .pill.now{background:var(--now);color:#fff}
  .pill.res{color:var(--ink)}
  .pill.tap{border:1px dashed var(--dim);background:none}
  .pill.right{margin-left:auto}
  .actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .btn{background:var(--line);color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
  .btn.warn{background:var(--now);color:#fff}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
  .btn:focus-visible{outline:2px solid var(--follow)}
  .name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* day switch */
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--panel);border-radius:9px;padding:3px;gap:2px}
  .seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:14px;padding:7px 14px;border-radius:7px}
  .seg button.on{background:var(--line);color:var(--ink);font-weight:600}
  .seg button:focus-visible{outline:2px solid var(--follow)}
  /* bracket */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);font:inherit;font-size:13px;padding:6px 11px;border-radius:99px}
  .chips button.on{background:var(--follow);border-color:var(--follow);color:#1b2230;font-weight:600}
  .bwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0 10px;margin:0 -12px;padding-left:12px}
  .bracket{display:flex;gap:26px;width:max-content;--pitch:72px;--gap:26px;padding-right:12px}
  .col{width:164px;flex:0 0 auto}
  .col h3{font-size:12px;color:var(--dim);font-weight:600;margin:0 0 8px;text-align:center;letter-spacing:.04em;text-transform:uppercase}
  .slots{display:flex;flex-direction:column;height:calc(var(--n1)*var(--pitch))}
  .slot{flex:1;display:flex;align-items:center;position:relative}
  .slot.single{flex:none;height:var(--pitch)}
  .col+.col .slot::before{content:"";position:absolute;left:calc(-1*var(--gap));width:calc(var(--gap)/2);top:25%;height:50%;border:2px solid var(--line);border-left:0;border-radius:0 3px 3px 0}
  .col+.col .slot::after{content:"";position:absolute;left:calc(var(--gap)/-2);width:calc(var(--gap)/2);top:50%;border-top:2px solid var(--line)}
  .bx{background:var(--panel);border-radius:8px;padding:3px 5px 4px;width:100%;border:1px solid transparent;position:relative;z-index:1}
  .bx.live{border-color:var(--live)}
  .bx.now{border-color:var(--now)}
  .bx .meta{font-size:10px;margin:0 0 1px 3px;gap:4px;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .bx .name{font-size:13px;padding:2px 3px;gap:5px;overflow:hidden}
  .bx .seed{min-width:14px;font-size:10px}
  /* live mats */
  .mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
  .mat{background:var(--panel);border-radius:10px;padding:10px 12px;border-top:3px solid var(--line)}
  .mat.live{border-top-color:var(--live)}
  .mat .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);margin-bottom:6px}
  .mat .hd b{color:var(--ink);font-size:13px}
  .mat .clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--live);font-size:14px}
  .mat .who{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:15px}
  .mat .who .sc{font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
  .mat .who.w{color:var(--win)} .mat .who.l{color:var(--dim)}
  .mat .who.follow{color:var(--follow)}
  .mat .ft{font-size:12px;color:var(--dim);margin-top:4px}
  label{display:block;margin:12px 0 4px;color:var(--dim);font-size:13px}
  input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px;font:inherit;font-size:16px}
  textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .blocklist div{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
  .blocklist span{flex:1}
  .blocklist button{width:36px;height:36px;border-radius:8px;border:0;background:var(--line);color:var(--ink);font-size:16px}
  .note{font-size:13px;color:var(--dim);margin-top:6px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="tabs">
    <button data-tab="next" class="on">Next up</button>
    <button data-tab="brackets">Brackets</button>
    <button data-tab="settings">Settings</button>
  </div>
  <div class="status" id="status"></div>
</header>
<main id="main"><div class="card">Loading bracket…</div></main>
<div class="toast" id="toast"></div>

<script>
// ---------- sources ----------
// Bracket + results: data/results.json, written by scripts/sync.mjs from FloArena's bout endpoints
// (a GitHub Actions cron reruns it every few minutes). Live mats: FloArena's public Firebase feed,
// polled straight from the browser. Both are read-only; taps are a local overlay on top.
const EVENT='52703b65-bade-46e2-9ce2-399dd32d93e4';
const DATA_URL='data/results.json';
const LIVE_URL=`https://floarena.firebaseio.com/${EVENT}/mats.json`;
const ROUND_LABEL={R32:'R32',R16:'R16',QF:'QF',SF:'SF',F:'Final','3':'3rd place'};

let DATA=null;            // parsed results.json
let LIVE={};              // boutNumber -> live mat entry
let liveState='off';      // 'ok' | 'bad' | 'off'
let dataErr=null, lastLive=0;
const quiet=()=>tab==='settings'&&DATA; // don't re-render under the user's fingers on Settings

// Schedule blocks: the order the day runs in. Editable in Settings. `kind` matches results.json divisions.
const DEFAULT_BLOCKS = [
  {id:'m-R16', label:"Men R16",   kind:'pro', sex:'m', round:'R16', day:1},
  {id:'w-QF',  label:"Women QF",  kind:'pro', sex:'w', round:'QF',  day:1},
  {id:'m-QF',  label:"Men QF",    kind:'pro', sex:'m', round:'QF',  day:1},
  {id:'m-SF',  label:"Men SF",    kind:'pro', sex:'m', round:'SF',  day:2},
  {id:'w-SF',  label:"Women SF",  kind:'pro', sex:'w', round:'SF',  day:2},
  {id:'abs-R16',label:"Absolute R16",kind:'abs', round:'R16', day:2},
  {id:'abs-QF',label:"Absolute QF",kind:'abs', round:'QF',  day:2},
  {id:'w-3',   label:"Women 3rd", kind:'pro', sex:'w', round:'3',   day:2},
  {id:'m-3',   label:"Men 3rd",   kind:'pro', sex:'m', round:'3',   day:2},
  {id:'abs-SF',label:"Absolute SF",kind:'abs', round:'SF',  day:2},
  {id:'w-F',   label:"Women F",   kind:'pro', sex:'w', round:'F',   day:2},
  {id:'m-F',   label:"Men F",     kind:'pro', sex:'m', round:'F',   day:2},
  {id:'abs-3', label:"Absolute 3rd",kind:'abs', round:'3',  day:2},
  {id:'abs-F', label:"Absolute F",kind:'abs', round:'F',   day:2},
  {id:'sf-F',  label:"Super fights",kind:'sf', round:'F',  day:2},
];

const DEFAULT = {
  taps:{},                         // "divId|round|m" -> 0|1, local results for bouts FloArena hasn't reported
  follow:['Felipe Costa','Victor Hugo'],
  mats:3, day:null,                // null = auto by date
  start1:'11:00', start2:'11:00',
  dur:{R32:12, R16:12, QF:20, SF:20, '3':20, F:30},
  blocks:DEFAULT_BLOCKS.map(b=>b.id),
  anchor:null,                     // {key, at}: the match that was on the mat at time `at`
  bracketDiv:null,                 // division shown on the Brackets tab
  v:9,
};
let S = JSON.parse(JSON.stringify(DEFAULT));
let tab='next';

// ---------- persistence (local to this browser) ----------
const store = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
function loadState(){
  try{ const v=store.get('adcc26'); if(v){ const o=JSON.parse(v); S=Object.assign({},DEFAULT,o); S.dur=Object.assign({},DEFAULT.dur,o.dur||{}); } }catch(e){}
  if((S.v||0)<9){ // results used to be baked into the page; they now come from FloArena
    S.taps={}; S.anchor=null; delete S.winners; delete S.third;
    S.blocks=DEFAULT.blocks.slice(); S.v=9; save();
  }
  S.blocks=S.blocks.filter(id=>DEFAULT_BLOCKS.some(b=>b.id===id));
  for(const b of DEFAULT_BLOCKS) if(!S.blocks.includes(b.id)) S.blocks.splice(DEFAULT_BLOCKS.indexOf(b),0,b.id);
}
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>store.set('adcc26', JSON.stringify(S)),150); }

// ---------- data fetching ----------
async function loadData(){
  try{ const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); DATA=await r.json(); dataErr=null; }
  catch(e){ dataErr=e; }
  if(quiet()) renderStatus(); else render();
}
async function loadLive(){
  try{ const r=await fetch(LIVE_URL,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json();
    const next={};
    for(const k in (j||{})){ const v=j[k]; if(!v||!v.matName||!v.boutNumber) continue;
      next[String(v.boutNumber)]={ n:String(v.boutNumber), mat:v.matName, matIdx:(parseInt(String(v.matName).replace(/\D/g,''),10)||1)-1,
        red:{name:`${v.redFirstName||''} ${v.redLastName||''}`.trim(), seed:v.redSeed, score:v.redScore??0, pen:v.redPenalties??0},
        blue:{name:`${v.blueFirstName||''} ${v.blueLastName||''}`.trim(), seed:v.blueSeed, score:v.blueScore??0, pen:v.bluePenalties??0},
        clock:v.clock||'', period:v.period||'', over:!!v.isMatchOver, winner:v.winner==='red'?0:v.winner==='blue'?1:null,
        winType:v.winType||null, finalScore:v.finalScore||null, updated:v.updated||0, weight:v.weight||'', round:v.round||'', division:v.division||'' }; }
    LIVE=next; liveState='ok'; lastLive=Date.now();
  }catch(e){ liveState = liveState==='ok' ? 'bad' : 'off'; }
  if(quiet()) renderStatus(); else render();
}

// ---------- bracket engine ----------
function divs(){ return DATA?DATA.divs:[]; }
function rounds(div){ return div.rounds.map(r=>r.name); }
function boutAt(div,rName,m){ if(rName==='3') return div.third; const r=div.rounds.find(r=>r.name===rName); return r?r.bouts[m]:null; }
function keyOf(div,rName,m){ return `${div.id}|${rName}|${m}`; }
function liveFor(b){ return b&&b.n ? LIVE[String(b.n)] : null; }
// winner of a bout: FloArena's result, else the live mat feed, else a local tap. Returns {w, src} or null.
function winnerInfo(div,rName,m){
  const b=boutAt(div,rName,m); if(!b) return null;
  if(b.w!==null&&b.w!==undefined) return {w:b.w, src:'flo'};
  if(b.decided) return {w:-1, src:'flo'};   // decided with no winner (double DQ); -1 marks both as out
  const l=liveFor(b); if(l&&l.over&&l.winner!==null) return {w:l.winner, src:'live'};
  const t=S.taps[keyOf(div,rName,m)]; if(t===0||t===1) return {w:t, src:'tap'};
  return null;
}
function winnerOf(div,rName,m){ const i=winnerInfo(div,rName,m); return i?i.w:null; }
// participant in slot s of bout m: FloArena's listed athlete, else propagated from the previous round
function slot(div,rName,m,s){
  const b=boutAt(div,rName,m); const p=b?(s?b.b:b.a):null; if(p&&p.name) return p;
  const rn=rounds(div);
  if(rName==='3'){ const sf=rn[rn.length-2]; const w=winnerOf(div,sf,s); if(w===null||w<0) return {tbd:true,label:`SF ${s+1} loser`}; return slot(div,sf,s,1-w); }
  const ri=rn.indexOf(rName); if(ri<=0) return {tbd:true,label:'TBD'};
  const prev=rn[ri-1], pm=m*2+s, w=winnerOf(div,prev,pm);
  if(w===null) return {tbd:true,label:`${prev} ${pm+1}`};
  if(w<0) return {tbd:true,label:`${prev} ${pm+1} · no winner`};
  return slot(div,prev,pm,w);
}
function matchObj(div,rName,m){
  const b=boutAt(div,rName,m); const wi=winnerInfo(div,rName,m);
  return {div,rName,m,key:keyOf(div,rName,m),bout:b,a:slot(div,rName,m,0),b:slot(div,rName,m,1),w:wi?wi.w:null,src:wi?wi.src:null,live:liveFor(b)};
}
function allMatches(block){
  const out=[];
  for(const div of divs()){
    if(div.kind!==block.kind) continue; if(block.sex&&div.sex!==block.sex) continue;
    if(block.round==='3'){ if(div.third) out.push(matchObj(div,'3',0)); continue; }
    const r=div.rounds.find(r=>r.name===block.round); if(!r) continue;
    for(let m=0;m<r.bouts.length;m++) out.push(matchObj(div,block.round,m));
  }
  return out;
}
function setWinner(mo,s){
  if(mo.src==='flo'){ toast('FloArena has this result already'); return; }
  if(mo.src==='live'){ toast('Live feed has this result already'); return; }
  const k=mo.key;
  if(S.taps[k]===s) delete S.taps[k]; else S.taps[k]=s;
  // clear downstream taps that depended on this bout
  const rn=rounds(mo.div);
  if(mo.rName!=='3'){ const ri=rn.indexOf(mo.rName);
    for(let r=ri+1;r<rn.length;r++) delete S.taps[keyOf(mo.div,rn[r],mo.m>>(r-ri))];
    if(ri>=rn.length-2) delete S.taps[keyOf(mo.div,'3',0)]; }
  save(); render();
}

// ---------- schedule engine ----------
function localDate(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function today(){ return S.day || (localDate()<=DAY_DATES[1]?1:2); }
const DAY_DATES={1:'2026-09-12',2:'2026-09-13'};
function dayStart(d){ const t=(d===1?S.start1:S.start2).split(':'); const [y,mo,da]=DAY_DATES[d].split('-').map(Number); return new Date(y,mo-1,da,+t[0]||11,+t[1]||0,0,0); }
function blocks(){ return S.blocks.map(id=>DEFAULT_BLOCKS.find(b=>b.id===id)).filter(Boolean); }
function clockSecs(c){ const m=String(c||'').match(/(\d+):(\d+)/); return m? (+m[1])*60+(+m[2]) : 0; }
function liveInProgress(){ const cut=Date.now()-3*3600e3; return Object.values(LIVE).filter(l=>!l.over&&l.updated>cut).sort((a,b)=>a.matIdx-b.matIdx); }
function queue(){
  const d=today(); const full=[];
  for(const b of blocks()){ if(b.day!==d) continue; for(const mo of allMatches(b)) full.push(mo); }
  const inProg=liveInProgress();
  let startAt=dayStart(d), from=0, mode='schedule';
  // 1) live feed: the earliest in-progress bout that is in today's list anchors the projection at "now"
  const liveIdx=full.map((mo,i)=>inProg.some(l=>mo.bout&&l.n===String(mo.bout.n))?i:-1).filter(i=>i>=0);
  if(liveIdx.length){ from=Math.min(...liveIdx); startAt=new Date(); mode='live'; }
  // 2) manual anchor: the match that was on the mat at `at`; never project into the past
  else if(S.anchor){ const i=full.findIndex(x=>x.key===S.anchor.key);
    if(i>=0){ from=i; startAt=new Date(S.anchor.at); mode='anchor'; if(Date.now()>startAt.getTime()) startAt=new Date(); } }
  else if(Date.now()>startAt.getTime()) startAt=new Date();
  // FloArena's published per-mat order, when it exists, beats the block-order guess.
  // Match by bout number against every bout in the bracket, not just today's blocks (the day tags are a guess).
  const byN=new Map();
  for(const div of divs()){
    for(const r of div.rounds) r.bouts.forEach((b,m)=>{ if(b.n) byN.set(String(b.n), matchObj(div,r.name,m)); });
    if(div.third&&div.third.n) byN.set(String(div.third.n), matchObj(div,'3',0));
  }
  const matIdx=name=>(parseInt(String(name||'').replace(/\D/g,''),10)||1)-1;
  const upMats=(DATA.mats||[]).map(m=>({idx:matIdx(m.name), list:(m.upcoming||[]).map(u=>byN.get(String(u.n))).filter(Boolean)})).filter(m=>m.list.length);
  // entries listed before the bout that anchors "now" on that mat (a live in-progress bout, or the manual anchor) are treated as already run
  for(const m of upMats){ const cut=m.list.findIndex(mo=>(mo.live&&!mo.live.over&&inProg.includes(mo.live))||(mode==='anchor'&&S.anchor.key===mo.key)); if(cut>0) m.list=m.list.slice(cut); }
  const floOrder=upMats.length>0;
  const nMats=Math.max(1,S.mats|0, ...inProg.map(l=>l.matIdx+1), ...upMats.map(m=>m.idx+1));
  const mats=Array.from({length:nMats},()=>startAt.getTime());
  for(const l of inProg) mats[l.matIdx]=Date.now()+(Math.min(clockSecs(l.clock),20*60)+120)*1000; // remaining time + changeover
  // mats in use: the ones FloArena lists bouts for plus any with a live bout; otherwise every mat up to the configured count (or a live bout's mat)
  const active = floOrder ? [...new Set([...upMats.map(m=>m.idx), ...inProg.map(l=>l.matIdx)])].sort((a,b)=>a-b) : mats.map((_,k)=>k);
  const out=[], placed=new Set();
  const place=(mo,mi)=>{ mo.at=new Date(mats[mi]); mo.mat=mi+1; mats[mi]+=(S.dur[mo.rName]||12)*60000; out.push(mo); placed.add(mo.key); };
  const onMat=mo=>{ const l=mo.live; if(l&&!l.over&&inProg.includes(l)){ mo.at=new Date(); mo.mat=l.matIdx+1; mo.onMat=true; out.push(mo); placed.add(mo.key); return true; } return false; };
  for(const m of upMats) for(const mo of m.list){ if(placed.has(mo.key)||onMat(mo)||mo.w!==null) continue; place(mo,m.idx); }
  for(let i=from;i<full.length;i++){
    const mo=full[i]; if(placed.has(mo.key)||onMat(mo)||mo.w!==null) continue;
    let mi=active[0]; for(const k of active) if(mats[k]<mats[mi]) mi=k;
    place(mo,mi);
  }
  out.sort((a,b)=>a.at-b.at||a.mat-b.mat);
  return {list:out, mode, floOrder, matCount:active.length};
}
function isFollow(p){ return p&&p.name && S.follow.some(f=>f && p.name.toLowerCase().includes(f.toLowerCase())); }
function fmt(dt){ return dt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
function rel(dt){ const m=Math.round((dt-Date.now())/60000); if(m<=0) return 'now'; if(m<60) return `in ${m} min`; return `in ${Math.floor(m/60)}h ${m%60}m`; }
function ago(ts){ const m=Math.round((Date.now()-ts)/60000); if(m<1) return 'just now'; if(m<60) return `${m} min ago`; return `${Math.floor(m/60)}h ${m%60}m ago`; }

// ---------- rendering ----------
const $=s=>document.querySelector(s);
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pName(p,mo,s){
  if(p.tbd) return `<span class="name tbd">${esc(p.label)}</span>`;
  const c=['name', isFollow(p)?'follow':'', mo.w===s?'win':'', (mo.w!==null&&mo.w!==s)?'lose':''].join(' ');
  return `<button class="${c}" data-win="${mo.key}|${s}"><span class="seed">${p.seed||''}</span><span class="nm">${esc(p.name)}</span></button>`;
}
function resultPill(mo){
  const b=mo.bout;
  if(mo.src==='flo'&&b) return `<span class="pill res right">${esc([b.winType,b.result].filter(Boolean).join(' '))}</span>`;
  if(mo.src==='live'&&mo.live) return `<span class="pill res right">${esc([mo.live.winType,mo.live.finalScore].filter(Boolean).join(' '))} · live</span>`;
  if(mo.src==='tap') return `<span class="pill tap right">your tap</span>`;
  return '';
}
function renderMats(){
  const cut=Date.now()-3*3600e3;
  const ms=Object.values(LIVE).filter(l=>l.updated>cut).sort((a,b)=>a.matIdx-b.matIdx);
  if(!ms.length) return '';
  let h=`<h2>On the mats <span style="font-weight:400">· FloArena live</span></h2><div class="mats">`;
  for(const l of ms){
    const who=(p,i)=>`<div class="who ${l.over?(l.winner===i?'w':'l'):''} ${isFollow(p)?'follow':''}"><span><span class="seed">${p.seed||''}</span> ${esc(p.name)}</span><span class="sc">${p.score}${p.pen?`<small style="color:var(--dim)"> p${p.pen}</small>`:''}</span></div>`;
    h+=`<div class="mat ${l.over?'':'live'}"><div class="hd"><span><b>${esc(l.mat)}</b> · ${esc(l.weight)}${l.weight&&!/kg|abs/i.test(l.weight)?'kg':''} ${esc(l.round)} · #${esc(l.n)}</span>${l.over?`<span>Final</span>`:`<span class="clock">${esc(l.clock)}${l.period&&l.period!=='1'?' '+esc(l.period):''}</span>`}</div>${who(l.red,0)}${who(l.blue,1)}<div class="ft">${l.over?`${esc(l.winType||'')} · ended ${ago(l.updated)}`:`updated ${ago(l.updated)}`}</div></div>`;
  }
  return h+`</div>`;
}
function renderNext(){
  const {list:q,mode,floOrder,matCount:matsInUse}=queue(); const d=today();
  let h=`<div class="topline"><div class="seg" role="tablist">${[1,2].map(x=>`<button data-day="${x}" class="${d===x?'on':''}" aria-pressed="${d===x}">Day ${x}</button>`).join('')}</div><span class="note" style="margin:0">${matsInUse} mat${matsInUse===1?'':'s'}${floOrder?'':' (assumed)'} · times are estimates${mode==='live'?' · anchored to the live feed':mode==='anchor'?' · anchored manually':''}${floOrder?' · order from FloArena':''}</span></div>`;
  h+=renderMats();
  const fl=S.follow.filter(Boolean);
  for(const f of fl){
    const hit=x=>x&&x.name&&x.name.toLowerCase().includes(f.toLowerCase());
    const mo=q.find(x=>hit(x.a)||hit(x.b));
    if(mo){
      const opp=hit(mo.a)?mo.b:mo.a;
      const when=mo.onMat?`on Mat ${mo.mat} now`:`${fmt(mo.at)} · ${rel(mo.at)} · Mat ${mo.mat}`;
      h+=`<div class="card follow-card"><div class="big">${esc(f)}${mo.onMat?'':' · '+fmt(mo.at)}</div><div class="sub">${when} · ${esc(mo.div.name)} ${ROUND_LABEL[mo.rName]||mo.rName} · vs ${opp.tbd?esc(opp.label):esc(opp.name)}</div></div>`;
    } else {
      let status='No match left in today’s queue';
      for(const div of divs()) for(const r of div.rounds) for(let m=0;m<r.bouts.length;m++){ const mo=matchObj(div,r.name,m);
        if(mo.w!==null){ const l=mo.w===0?mo.b:mo.a; if(hit(l)) status=`Eliminated in ${div.name} ${ROUND_LABEL[r.name]||r.name}`; } }
      for(const div of divs()){ const rn=rounds(div); const w=winnerOf(div,rn[rn.length-1],0); if(w!==null&&hit(slot(div,rn[rn.length-1],0,w))) status=`${div.name} champion 🥇`; }
      h+=`<div class="card follow-card"><div class="big">${esc(f)}</div><div class="sub">${status}</div></div>`;
    }
  }
  h+=`<h2>Up next</h2>`;
  if(!q.length) h+=`<div class="card">Nothing left in today’s queue. Check the block order in Settings, or change the day.</div>`;
  else h+=`<div class="card">`;
  q.slice(0,48).forEach(mo=>{
    const isNow=mo.onMat||(mode==='anchor'&&S.anchor&&S.anchor.key===mo.key);
    h+=`<div class="row ${isNow?'now':''}"><div class="t">${mo.onMat?'now':fmt(mo.at)}<small>Mat ${mo.mat}</small></div>
      <div><div class="meta">${esc(mo.div.name)} ${ROUND_LABEL[mo.rName]||mo.rName}${mo.bout&&mo.bout.n?' · #'+esc(mo.bout.n):''} ${mo.onMat?`<span class="pill now">on the mat · ${esc(mo.live.clock)}</span>`:isNow?'<span class="pill now">on the mat</span>':`<button class="btn ghost" style="padding:2px 8px;font-size:12px" data-now="${mo.key}">set as now</button>`}</div>
      <div class="vs">${pName(mo.a,mo,0)}${pName(mo.b,mo,1)}</div></div></div>`;
  });
  if(q.length) h+=`</div>`;
  h+=`<div class="note">Results arrive from FloArena automatically. Tap a name only if the feed is behind — it advances the bracket here until FloArena confirms it. "Set as now" re-projects everything from that match starting at the current time.</div>`;
  if(S.anchor) h+=`<div class="actions"><button class="btn ghost" id="clearAnchor">Clear "now" anchor</button></div>`;
  return h;
}
function currentDiv(){
  const ds=divs(); if(!ds.length) return null;
  return ds.find(x=>x.id===S.bracketDiv) || ds.find(d=>d.rounds.some(r=>r.bouts.some(b=>isFollow(b.a)||isFollow(b.b)))) || ds[0];
}
function box(mo){
  const b=mo.bout||{}; const bits=[];
  if(b.n) bits.push('#'+b.n);
  if(b.mat&&mo.w!==null) bits.push(b.mat);
  if(mo.src==='flo'&&(b.winType||b.result)) bits.push([b.winType,b.result].filter(Boolean).join(' '));
  else if(mo.src==='live'&&mo.live) bits.push([mo.live.winType,mo.live.finalScore].filter(Boolean).join(' ')+' · live');
  else if(mo.src==='tap') bits.push('your tap');
  const live=mo.live&&!mo.live.over; if(live) bits.push('on the mat · '+mo.live.clock);
  const now=!live&&S.anchor&&S.anchor.key===mo.key;
  return `<div class="bx ${live?'live':''} ${now?'now':''}"><div class="meta">${esc(bits.join(' · '))||'&nbsp;'}</div>${pName(mo.a,mo,0)}${pName(mo.b,mo,1)}</div>`;
}
function renderBrackets(){
  const ds=divs(); const div=currentDiv(); if(!div) return `<div class="card">No bracket data yet.</div>`;
  let h=`<div class="chips">${ds.map(d=>{ const rn=rounds(d); const c=winnerOf(d,rn[rn.length-1],0); return `<button data-bdiv="${esc(d.id)}" class="${d.id===div.id?'on':''}">${esc(d.name)}${c!==null&&c>=0?' 🥇':''}</button>`; }).join('')}</div>`;
  const n1=div.rounds[0].bouts.length;
  h+=`<div class="bwrap"><div class="bracket" style="--n1:${n1}">`;
  for(const r of div.rounds){
    h+=`<div class="col"><h3>${ROUND_LABEL[r.name]||r.name}</h3><div class="slots">`;
    for(let m=0;m<r.bouts.length;m++) h+=`<div class="slot">${box(matchObj(div,r.name,m))}</div>`;
    h+=`</div></div>`;
  }
  h+=`</div></div>`;
  if(div.third) h+=`<div class="bracket" style="--n1:1;margin-top:4px"><div class="col"><h3>3rd place</h3><div class="slot single">${box(matchObj(div,'3',0))}</div></div></div>`;
  h+=`<div class="note">Tap a name to record a result the feed doesn't have yet. Scroll sideways for later rounds.</div>`;
  return h;
}
function renderSettings(){
  const b=blocks();
  return `
  <div class="card">
    <label for="follow">Following (comma separated, partial names ok)</label><input id="follow" value="${esc(S.follow.join(', '))}">
    <div class="grid2">
      <div><label for="mats">Mats running</label><input id="mats" type="number" min="1" max="6" value="${+S.mats||3}"></div>
      <div><label>Day</label><div class="note" style="margin:0;padding-top:9px">Picked on the Next up tab${S.day?'':' (auto: '+today()+')'}</div></div>
      <div><label for="start1">Day 1 first match</label><input id="start1" type="time" value="${esc(S.start1)}"></div>
      <div><label for="start2">Day 2 first match</label><input id="start2" type="time" value="${esc(S.start2)}"></div>
    </div>
    <label>Minutes per match slot, incl. changeover</label>
    <div class="grid2">
      ${['R16','QF','SF','3','F'].map(k=>`<div><label for="dur-${k}" style="margin-top:4px">${ROUND_LABEL[k]||k}</label><input id="dur-${k}" data-dur="${k}" type="number" value="${+S.dur[k]||12}"></div>`).join('')}
    </div>
  </div>
  <div class="card"><label style="margin-top:0">Running order (assumed — fix it as the day reveals itself)</label>
    <div class="blocklist">${b.map((x,i)=>`<div><span>Day ${x.day} · ${esc(x.label)}</span><button data-up="${i}" aria-label="move up">↑</button><button data-dn="${i}" aria-label="move down">↓</button></div>`).join('')}</div>
  </div>
  <div class="card"><label style="margin-top:0" for="dump">Your local taps and anchor (paste JSON to restore)</label>
    <textarea id="dump">${esc(JSON.stringify({taps:S.taps,anchor:S.anchor}))}</textarea>
    <div class="actions"><button class="btn" id="restore">Restore from text</button><button class="btn warn" id="reset">Reset everything</button></div>
    <div class="note">Bracket and results come from FloArena (${DATA?'synced '+new Date(DATA.updated).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'not loaded'}). Live scores come from FloArena's mat feed. Taps and settings live only in this browser.</div>
  </div>`;
}
function renderStatus(){
  const s=$('#status'); if(!s) return;
  const dataTxt = DATA ? `<b>${new Date(DATA.updated).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</b>` : (dataErr?'<b>failed</b>':'…');
  const liveTxt = liveState==='ok' ? `<span class="dot ok"></span>live ${lastLive?ago(lastLive):''}` : liveState==='bad' ? `<span class="dot bad"></span>live feed lost` : `<span class="dot"></span>live feed off`;
  s.innerHTML=`<span>Results ${dataErr&&DATA?'<span class="dot bad"></span>':''}${dataTxt}</span><span>${liveTxt}</span>`;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  renderStatus();
  if(!DATA){ $('#main').innerHTML = dataErr ? `<div class="card">Couldn’t load the bracket (${esc(dataErr.message)}). Retrying every minute.</div>` : `<div class="card">Loading bracket…</div>`; return; }
  $('#main').innerHTML = tab==='next'?renderNext():tab==='brackets'?renderBrackets():renderSettings();
}
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1400); }

// ---------- events ----------
document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ tab=b.dataset.tab; render(); window.scrollTo(0,0);} });
$('#main').addEventListener('click',e=>{
  const w=e.target.closest('[data-win]'); if(w){ const [divId,r,m,s]=w.dataset.win.split('|'); const div=divs().find(d=>d.id===divId); if(div) setWinner(matchObj(div,r,+m),+s); return; }
  const dy=e.target.closest('[data-day]'); if(dy){ S.day=+dy.dataset.day; save(); render(); return; }
  const bd=e.target.closest('[data-bdiv]'); if(bd){ S.bracketDiv=bd.dataset.bdiv; save(); render(); return; }
  const n=e.target.closest('[data-now]'); if(n){ S.anchor={key:n.dataset.now, at:new Date().toISOString()}; save(); render(); toast('Re-projected from now'); return; }
  if(e.target.id==='clearAnchor'){ S.anchor=null; save(); render(); return; }
  const up=e.target.closest('[data-up]'), dn=e.target.closest('[data-dn]');
  if(up||dn){ const i=+(up||dn).dataset[up?'up':'dn'], j=up?i-1:i+1; if(j<0||j>=S.blocks.length) return; [S.blocks[i],S.blocks[j]]=[S.blocks[j],S.blocks[i]]; save(); render(); return; }
  if(e.target.id==='restore'){ try{ const o=JSON.parse($('#dump').value); if(o.taps&&typeof o.taps==='object') S.taps=o.taps; if('anchor' in o) S.anchor=o.anchor; save(); render(); toast('Restored'); }catch(err){ toast('That JSON didn’t parse'); } return; }
  if(e.target.id==='reset'){ // two-tap confirm: native confirm() is blocked in sandboxed iframes
    if(e.target.dataset.armed){ S=JSON.parse(JSON.stringify(DEFAULT)); save(); render(); toast('Reset'); }
    else{ e.target.dataset.armed='1'; e.target.textContent='Tap again to wipe taps and settings'; setTimeout(()=>{ if(e.target.isConnected){ delete e.target.dataset.armed; e.target.textContent='Reset everything'; } },4000); }
    return; }
});
$('#main').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='follow') S.follow=t.value.split(',').map(x=>x.trim()).filter(Boolean);
  if(t.id==='mats') S.mats=Math.max(1,+t.value||1);
  if(t.id==='start1') S.start1=t.value; if(t.id==='start2') S.start2=t.value;
  if(t.dataset.dur) S.dur[t.dataset.dur]=+t.value||12;
  save();
});
// refresh loops: results every 60s, live mats every 15s; the Settings tab is left alone while you type
setInterval(()=>{ if(!quiet()) loadData(); },60000);
setInterval(()=>{ if(!quiet()) loadLive(); },15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ loadData(); loadLive(); } });
loadState(); loadData(); loadLive();
</script>
</body>
</html>
