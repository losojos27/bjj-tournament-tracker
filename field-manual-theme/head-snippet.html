<!-- Paste into every page's <head>, in this order. Replace "app.theme" with
     your app's key in BOTH the bootstrap and the theme.js data-key. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f0ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#343331" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('app.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="theme.css">
