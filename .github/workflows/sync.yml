name: sync results from FloArena
on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub only honours this loosely (gaps of hours overnight), so each run loops itself
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false   # a new fire waits for the running loop to finish, so coverage is continuous
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync every 5 minutes for ~5.5 hours, committing when results change
        env:
          SYNC_STRICT: '1'
        run: |
          git config user.name "flo-sync"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 66); do
            node scripts/sync.mjs || echo "::warning::sync exited non-zero on pass $i (see log above)"
            if ! git diff --quiet -- data/results.json; then
              git add data/results.json
              git commit -q -m "sync: results $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase && git push -q && echo "pushed pass $i"
            fi
            sleep 300
          done
