name: sync results from FloArena
on:
  # schedule is off between events (ADCC 2026 ended Sept 13). Re-enable the cron before the next one;
  # GitHub only honours it loosely (gaps of hours overnight), which is why each run loops itself.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false   # a new fire waits for the running loop to finish, so coverage is continuous
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync every 5 minutes for ~5.5 hours, committing when results change
        env:
          SYNC_STRICT: '1'
        run: |
          git config user.name "flo-sync"
          git config user.email "actions@users.noreply.github.com"
          scripts/sync-loop.sh
